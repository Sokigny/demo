<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Séances - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i class="bi bi-film"></i>
                    <span>Cinema Admin</span>
                </div>
                <button class="sidebar-toggle">
                    <i class="bi bi-list"></i>
                </button>
            </div>
            <nav>
                <a th:href="@{/admin/dashboard}" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/admin/films}" class="nav-link">
                    <i class="bi bi-camera-reels"></i>
                    <span>Films</span>
                </a>
                <a th:href="@{/admin/salles}" class="nav-link">
                    <i class="bi bi-building"></i>
                    <span>Salles</span>
                </a>
                <a th:href="@{/admin/seances}" class="nav-link active">
                    <i class="bi bi-calendar-event"></i>
                    <span>Séances</span>
                </a>
            </nav>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-calendar-event text-netflix-red"></i> Gestion des Séances</h1>
                    <a th:href="@{/admin/seances/new}" class="btn btn-netflix">
                        <i class="bi bi-plus-circle me-2"></i>Nouvelle Séance
                    </a>
                </div>

                <!-- Messages Flash -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Liste des Séances -->
                <div class="card">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Film</th>
                                    <th>Salle</th>
                                    <th>Date</th>
                                    <th>Heure Début</th>
                                    <th>Heure Fin</th>
                                    <th>Durée</th>
                                    <th>Capacité Max</th>
                                    <th>Revenus</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="seance : ${seances}">
                                    <td>
                                        <strong th:text="${seance.film.titre}">Film Title</strong>
                                        <br>
                                        <small class="text-muted" th:text="${seance.film.genre}">Genre</small>
                                    </td>
                                    <td th:text="${seance.salle.nom}">Salle A</td>
                                    <td th:text="${seance.dateSeance != null ? #temporals.format(seance.dateSeance, 'dd/MM/yyyy') : '-'}">01/01/2024</td>
                                    <td th:text="${seance.heureDebut != null ? #temporals.format(seance.heureDebut, 'HH:mm') : '-'}">14:00</td>
                                    <td th:text="${seance.heureFin != null ? #temporals.format(seance.heureFin, 'HH:mm') : '-'}">16:00</td>
                                    <td th:text="${seance.heureDebut != null && seance.heureFin != null ? T(java.time.Duration).between(seance.heureDebut, seance.heureFin).toMinutes() + ' min' : '-'}">
                                        120 min
                                    </td>
                                    <td>
                                        <span class="badge bg-info" th:text="${capaciteMap[seance.id] != null ? capaciteMap[seance.id] + ' places' : seance.salle.capacite + ' places'}">100 places</span>
                                    </td>
                                    <td>
                                        <strong class="text-success" th:text="${revenusMap[seance.id] != null ? #numbers.formatDecimal(revenusMap[seance.id], 0, 'COMMA', 2, 'POINT') + ' Ar' : '0.00 Ar'}">0.00 Ar</strong>
                                    </td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/admin/seances/edit/{id}(id=${seance.id})}" 
                                               class="btn btn-sm btn-outline-primary" 
                                               title="Modifier la séance">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:href="@{/admin/seances/delete/{id}(id=${seance.id})}" 
                                               class="btn btn-sm btn-outline-danger"
                                               title="Supprimer"
                                               onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette séance ?')">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${seances.isEmpty()}">
                                    <td colspan="9" class="text-center text-muted py-4">
                                        <i class="bi bi-calendar-x fs-1 d-block mb-2"></i>
                                        Aucune séance trouvée
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
