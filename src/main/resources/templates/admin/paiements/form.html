<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${paiement.id != null ? 'Modifier le Paiement' : 'Nouveau Paiement'}">Paiement - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i class="bi bi-film"></i>
                    <span>Cinema Admin</span>
                </div>
                <button class="sidebar-toggle">
                    <i class="bi bi-list"></i>
                </button>
            </div>
            <nav>
                <a th:href="@{/admin/dashboard}" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/admin/films}" class="nav-link">
                    <i class="bi bi-camera-reels"></i>
                    <span>Films</span>
                </a>
                <a th:href="@{/admin/salles}" class="nav-link">
                    <i class="bi bi-building"></i>
                    <span>Salles</span>
                </a>
                <a th:href="@{/admin/seances}" class="nav-link">
                    <i class="bi bi-calendar-event"></i>
                    <span>Séances</span>
                </a>
                <a th:href="@{/admin/tarifs}" class="nav-link">
                    <i class="bi bi-currency-dollar"></i>
                    <span>Tarifs</span>
                </a>
                <a th:href="@{/admin/types-personne}" class="nav-link">
                    <i class="bi bi-people"></i>
                    <span>Types de Personne</span>
                </a>
                <a th:href="@{/admin/societes}" class="nav-link">
                    <i class="bi bi-building"></i>
                    <span>Sociétés</span>
                </a>
                <a th:href="@{/admin/publicites}" class="nav-link">
                    <i class="bi bi-badge-ad"></i>
                    <span>Publicités</span>
                </a>
                <a th:href="@{/admin/paiements}" class="nav-link active">
                    <i class="bi bi-cash-coin"></i>
                    <span>Paiements</span>
                </a>
                <a th:href="@{/admin/statistiques}" class="nav-link">
                    <i class="bi bi-graph-up"></i>
                    <span>Statistiques</span>
                </a>
            </nav>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container-fluid">
                <div class="mb-4">
                    <h1 class="h3 mb-0">
                        <i class="bi bi-cash-coin me-2"></i>
                        <span th:text="${paiement.id != null ? 'Modifier le Paiement' : 'Nouveau Paiement'}">
                            Nouveau Paiement
                        </span>
                    </h1>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Form Card -->
                <div class="card">
                    <div class="card-body">
                        <form th:action="${paiement.id != null ? '/admin/paiements/update/' + paiement.id : '/admin/paiements/create'}" 
                              th:object="${paiement}" 
                              method="post">
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="societe" class="form-label">
                                        <i class="bi bi-building me-1"></i>Société *
                                    </label>
                                    <select class="form-select" id="societe" th:field="*{societe.id}" required>
                                        <option value="">Sélectionner une société</option>
                                        <option th:each="societe : ${societes}" 
                                                th:value="${societe.id}" 
                                                th:text="${societe.nom}">
                                        </option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="montant" class="form-label">
                                        <i class="bi bi-cash me-1"></i>Montant (Ar) *
                                    </label>
                                    <input type="number" 
                                           class="form-control" 
                                           id="montant" 
                                           th:field="*{montant}" 
                                           min="0"
                                           step="1"
                                           required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="datePaiement" class="form-label">
                                        <i class="bi bi-calendar me-1"></i>Date de Paiement *
                                    </label>
                                    <input type="date" 
                                           class="form-control" 
                                           id="datePaiement" 
                                           th:field="*{datePaiement}" 
                                           required>
                                </div>
                            </div>
                            
                            <div class="alert alert-info">
                                <i class="bi bi-info-circle me-2"></i>
                                <strong>Répartition automatique :</strong> Le montant sera automatiquement réparti sur toutes les séances de la société selon le reste à payer de chaque séance.
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle me-1"></i>
                                    <span th:text="${paiement.id != null ? 'Modifier' : 'Créer'}">Créer</span>
                                </button>
                                <a th:href="@{/admin/paiements}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle me-1"></i>
                                    Annuler
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
