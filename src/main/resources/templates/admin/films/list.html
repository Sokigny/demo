<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Films - Cinema Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i class="bi bi-film"></i>
                    <span>Cinema Admin</span>
                </div>
                <button class="sidebar-toggle">
                    <i class="bi bi-list"></i>
                </button>
            </div>
            <nav>
                <a th:href="@{/admin/dashboard}" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/admin/films}" class="nav-link active">
                    <i class="bi bi-camera-reels"></i>
                    <span>Films</span>
                </a>
                <a th:href="@{/admin/salles}" class="nav-link">
                    <i class="bi bi-building"></i>
                    <span>Salles</span>
                </a>
                <a th:href="@{/admin/seances}" class="nav-link">
                    <i class="bi bi-calendar-event"></i>
                    <span>Séances</span>
                </a>
                <a th:href="@{/admin/tarifs}" class="nav-link">
                    <i class="bi bi-currency-dollar"></i>
                    <span>Tarifs</span>
                </a>
                <a th:href="@{/admin/types-personne}" class="nav-link">
                    <i class="bi bi-people"></i>
                    <span>Types de Personne</span>
                </a>
                <a th:href="@{/admin/societes}" class="nav-link">
                    <i class="bi bi-building"></i>
                    <span>Sociétés</span>
                </a>
                <a th:href="@{/admin/publicites}" class="nav-link">
                    <i class="bi bi-megaphone"></i>
                    <span>Publicités</span>
                </a>                <a th:href="@{/admin/paiements}" class="nav-link">
                    <i class="bi bi-cash-coin"></i>
                    <span>Paiements</span>
                </a>                <a th:href="@{/admin/statistiques}" class="nav-link">
                    <i class="bi bi-graph-up"></i>
                    <span>Statistiques</span>
                </a>
            </nav>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container-fluid">
                <!-- Flash Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle me-2"></i>
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-camera-reels text-netflix-red"></i> Gestion des Films</h1>
                    <a th:href="@{/admin/films/new}" class="btn btn-netflix">
                        <i class="bi bi-plus-lg me-2"></i>Nouveau Film
                    </a>
                </div>

                <!-- Films Grid -->
                <div class="row g-3">
                    <div th:each="film : ${films}" class="col-xl-3 col-lg-4 col-md-6">
                        <div class="card h-100">
                            <div class="film-poster" th:if="${film.imageUrl != null && !film.imageUrl.isEmpty()}">
                                <img th:src="${film.imageUrl}" class="card-img-top" th:alt="${film.titre}">
                            </div>
                            <div class="film-poster-placeholder" th:unless="${film.imageUrl != null && !film.imageUrl.isEmpty()}">
                                <i class="bi bi-film"></i>
                            </div>
                            <div class="card-body">
                                <h5 class="card-title text-truncate" th:text="${film.titre}">Titre du film</h5>
                                <!-- <p class="card-text">
                                    <span class="badge bg-netflix me-1" th:if="${film.genre}" th:text="${film.genre}">Genre</span>
                                    <span class="badge bg-secondary" th:if="${film.duree}" th:text="${film.duree + ' min'}">120 min</span>
                                </p>
                                <p class="card-text text-muted small" style="height: 40px; overflow: hidden;" th:if="${film.description}" th:text="${film.description}">
                                    Description du film...
                                </p> -->
                                <div class="d-grid gap-2 mt-3">
                                    <a th:href="@{/admin/films/edit/{id}(id=${film.id})}" class="btn btn-sm btn-warning">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/admin/films/delete/{id}(id=${film.id})}" 
                                       class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce film ?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(films)}" class="col-12">
                        <div class="card">
                            <div class="card-body text-center py-5">
                                <i class="bi bi-inbox display-1 text-muted d-block mb-3"></i>
                                <h4 class="text-muted">Aucun film pour le moment</h4>
                                <p class="text-muted">Commencez par ajouter votre premier film</p>
                                <a th:href="@{/admin/films/new}" class="btn btn-netflix mt-3">
                                    <i class="bi bi-plus-lg me-2"></i>Ajouter un Film
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
