<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title
      th:text="${film.id != null ? 'Modifier le Film' : 'Nouveau Film'} + ' - Cinema Admin'"
    >
      Film - Cinema Admin
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>
  <body>
    <div class="">
      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-brand">
            <i class="bi bi-film"></i>
            <span>Cinema Admin</span>
          </div>
          <button class="sidebar-toggle">
            <i class="bi bi-list"></i>
          </button>
        </div>
        <nav>
          <a th:href="@{/admin/dashboard}" class="nav-link">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
          </a>
          <a th:href="@{/admin/films}" class="nav-link active">
            <i class="bi bi-camera-reels"></i>
            <span>Films</span>
          </a>
          <a th:href="@{/admin/salles}" class="nav-link">
            <i class="bi bi-building"></i>
            <span>Salles</span>
          </a>
          <a th:href="@{/admin/seances}" class="nav-link">
            <i class="bi bi-calendar-event"></i>
            <span>Séances</span>
          </a>
          <a th:href="@{/admin/tarifs}" class="nav-link">
            <i class="bi bi-currency-dollar"></i>
            <span>Tarifs</span>
          </a>
          <a th:href="@{/admin/types-personne}" class="nav-link">
            <i class="bi bi-people"></i>
            <span>Types de Personne</span>
          </a>
          <a th:href="@{/admin/societes}" class="nav-link">
            <i class="bi bi-building"></i>
            <span>Sociétés</span>
          </a>
          <a th:href="@{/admin/publicites}" class="nav-link">
            <i class="bi bi-megaphone"></i>
            <span>Publicités</span>
          </a>
          <a th:href="@{/admin/paiements}" class="nav-link">
            <i class="bi bi-cash-coin"></i>
            <span>Paiements</span>
          </a>
          <a th:href="@{/admin/statistiques}" class="nav-link">
            <i class="bi bi-graph-up"></i>
            <span>Statistiques</span>
          </a>
        </nav>
      </nav>

      <!-- Main Content -->
      <main class="main-content">
        <div class="container-fluid">
          <!-- Header -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>
              <i class="bi bi-camera-reels text-netflix-red"></i>
              <span
                th:text="${film.id != null ? 'Modifier le Film' : 'Nouveau Film'}"
              ></span>
            </h1>
            <a th:href="@{/admin/films}" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left me-2"></i>Retour
            </a>
          </div>

          <!-- Form -->
          <div class="row justify-content-center">
            <div class="col-lg-8">
              <div class="card">
                <div class="card-body">
                  <form
                    th:action="${film.id != null ? '/admin/films/update/' + film.id : '/admin/films'}"
                    th:object="${film}"
                    method="post"
                  >
                    <div class="mb-3">
                      <label for="titre" class="form-label">
                        <i class="bi bi-film me-1"></i>Titre du Film
                        <span class="text-danger">*</span>
                      </label>
                      <input
                        type="text"
                        class="form-control"
                        id="titre"
                        th:field="*{titre}"
                        placeholder="Ex: Inception"
                        required
                      />
                    </div>

                    <div class="row">
                      <div class="col-md-6 mb-3">
                        <label for="genre" class="form-label">
                          <i class="bi bi-tag me-1"></i>Genre
                        </label>
                        <select
                          class="form-select"
                          id="genre"
                          th:field="*{genre}"
                        >
                          <option value="">Sélectionner un genre</option>
                          <option value="Action">Action</option>
                          <option value="Aventure">Aventure</option>
                          <option value="Comédie">Comédie</option>
                          <option value="Drame">Drame</option>
                          <option value="Horreur">Horreur</option>
                          <option value="Science-Fiction">
                            Science-Fiction
                          </option>
                          <option value="Thriller">Thriller</option>
                          <option value="Animation">Animation</option>
                          <option value="Documentaire">Documentaire</option>
                          <option value="Romance">Romance</option>
                        </select>
                      </div>

                      <div class="col-md-6 mb-3">
                        <label for="duree" class="form-label">
                          <i class="bi bi-clock me-1"></i>Durée (minutes)
                        </label>
                        <input
                          type="number"
                          class="form-control"
                          id="duree"
                          th:field="*{duree}"
                          placeholder="Ex: 120"
                          min="1"
                        />
                      </div>
                    </div>

                    <div class="mb-3">
                      <label for="imageUrl" class="form-label">
                        <i class="bi bi-image me-1"></i>URL de l'affiche
                      </label>
                      <input
                        type="url"
                        class="form-control"
                        id="imageUrl"
                        th:field="*{imageUrl}"
                        placeholder="https://exemple.com/affiche.jpg"
                      />
                      <small class="text-muted"
                        >URL complète de l'image d'affiche du film</small
                      >
                    </div>

                    <div class="mb-4">
                      <label for="description" class="form-label">
                        <i class="bi bi-file-text me-1"></i>Description
                      </label>
                      <textarea
                        class="form-control"
                        id="description"
                        th:field="*{description}"
                        rows="4"
                        placeholder="Synopsis du film..."
                      ></textarea>
                    </div>

                    <div class="d-flex gap-2">
                      <button type="submit" class="btn btn-netflix">
                        <i class="bi bi-check-lg me-2"></i>
                        <span
                          th:text="${film.id != null ? 'Mettre à jour' : 'Enregistrer'}"
                        ></span>
                      </button>
                      <a th:href="@{/admin/films}" class="btn btn-secondary">
                        <i class="bi bi-x-lg me-2"></i>Annuler
                      </a>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin.js}"></script>
  </body>
</html>
