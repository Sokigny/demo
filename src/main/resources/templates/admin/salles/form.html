<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${salle.id != null ? 'Modifier la Salle' : 'Nouvelle Salle'} + ' - Cinema Admin'">Salle - Cinema Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i class="bi bi-film"></i>
                    <span>Cinema Admin</span>
                </div>
                <button class="sidebar-toggle">
                    <i class="bi bi-list"></i>
                </button>
            </div>
            <nav>
                <a th:href="@{/admin/dashboard}" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/admin/films}" class="nav-link">
                    <i class="bi bi-camera-reels"></i>
                    <span>Films</span>
                </a>
                <a th:href="@{/admin/salles}" class="nav-link active">
                    <i class="bi bi-building"></i>
                    <span>Salles</span>
                </a>
                <a th:href="@{/admin/seances}" class="nav-link">
                    <i class="bi bi-calendar-event"></i>
                    <span>Séances</span>
                </a>
            </nav>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container-fluid">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>
                        <i class="bi bi-building text-netflix-red"></i>
                        <span th:text="${salle.id != null ? 'Modifier la Salle' : 'Nouvelle Salle'}"></span>
                    </h1>
                    <a th:href="@{/admin/salles}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Retour
                    </a>
                </div>

                <!-- Form -->
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card">
                            <div class="card-body">
                                <form th:action="${salle.id != null ? '/admin/salles/update/' + salle.id : '/admin/salles'}" 
                                      th:object="${salle}" 
                                      method="post">
                                    
                                    <div class="mb-3">
                                        <label for="nom" class="form-label">
                                            <i class="bi bi-tag me-1"></i>Nom de la Salle
                                            <span class="text-danger">*</span>
                                        </label>
                                        <input type="text" 
                                               class="form-control" 
                                               id="nom" 
                                               th:field="*{nom}" 
                                               placeholder="Ex: Salle 1"
                                               required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="cinema" class="form-label">
                                            <i class="bi bi-building me-1"></i>Cinéma
                                            <span class="text-danger">*</span>
                                        </label>
                                        <select class="form-select" 
                                                id="cinema" 
                                                th:field="*{cinema.id}" 
                                                required>
                                            <option value="">Sélectionner un cinéma</option>
                                            <option th:each="cinema : ${cinemas}" 
                                                    th:value="${cinema.id}" 
                                                    th:text="${cinema.nom}">
                                                Cinema Name
                                            </option>
                                        </select>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="capacite" class="form-label">
                                                <i class="bi bi-people me-1"></i>Capacité Totale
                                                <span class="text-danger">*</span>
                                            </label>
                                            <input type="number" 
                                                   class="form-control" 
                                                   id="capacite" 
                                                   th:field="*{capacite}" 
                                                   placeholder="Ex: 100"
                                                   min="1"
                                                   required>
                                            <small class="text-muted">Nombre total de sièges dans la salle</small>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label for="actif" class="form-label">
                                                <i class="bi bi-toggle-on me-1"></i>Statut
                                            </label>
                                            <select class="form-select" 
                                                    id="actif" 
                                                    th:field="*{actif}">
                                                <option th:value="true">Active</option>
                                                <option th:value="false">Inactive</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="d-flex gap-2 mt-4">
                                        <button type="submit" class="btn btn-netflix">
                                            <i class="bi bi-arrow-right me-2"></i>
                                            <span th:text="${salle.id != null ? 'Mettre à jour' : 'Suivant - Configurer les Sièges'}"></span>
                                        </button>
                                        <a th:href="@{/admin/salles}" class="btn btn-secondary">
                                            <i class="bi bi-x-lg me-2"></i>Annuler
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Sièges existants (mode édition) -->
                    <div th:if="${salle.id != null && sieges != null}" class="col-lg-4">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="bi bi-grid-3x3 me-2"></i>Sièges</h6>
                            </div>
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <span>Total: <strong th:text="${#lists.size(sieges)}">0</strong> sièges</span>
                                    <a th:href="@{/admin/salles/{id}/sieges(id=${salle.id})}" 
                                       class="btn btn-sm btn-outline-primary">
                                        Gérer <i class="bi bi-arrow-right ms-1"></i>
                                    </a>
                                </div>
                                
                                <div th:if="${!#lists.isEmpty(sieges)}" class="text-muted small">
                                    <i class="bi bi-check-circle text-success me-1"></i>
                                    Sièges configurés
                                </div>
                                <div th:if="${#lists.isEmpty(sieges)}" class="text-muted small">
                                    <i class="bi bi-exclamation-circle text-warning me-1"></i>
                                    Aucun siège configuré
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin.js}"></script>
    <script>
        // Calculer la capacité en temps réel
        const nbRangees = document.getElementById('nbRangees');
        const siegesParRangee = document.getElementById('siegesParRangee');
        const capacite = document.getElementById('capacite');

        if (nbRangees && siegesParRangee && capacite) {
            function updateCapacite() {
                const rangees = parseInt(nbRangees.value) || 0;
                const sieges = parseInt(siegesParRangee.value) || 0;
                capacite.value = rangees * sieges;
            }

            nbRangees.addEventListener('input', updateCapacite);
            siegesParRangee.addEventListener('input', updateCapacite);
        }
    </script>
</body>
</html>
