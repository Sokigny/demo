<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - Cinema Admin' : 'Cinema Admin'}">Cinema Admin</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark border-end" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom bg-danger">
                <i class="bi bi-film me-2"></i>
                <span class="fw-bold">CINEMA ADMIN</span>
            </div>
            <div class="list-group list-group-flush">
                <a th:href="@{/admin/dashboard}" 
                   class="list-group-item list-group-item-action bg-dark text-light"
                   th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/dashboard')} ? 'active' : ''">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a th:href="@{/admin/films}" 
                   class="list-group-item list-group-item-action bg-dark text-light"
                   th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/films')} ? 'active' : ''">
                    <i class="bi bi-camera-reels me-2"></i>Films
                </a>
                <a th:href="@{/admin/salles}" 
                   class="list-group-item list-group-item-action bg-dark text-light"
                   th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/salles')} ? 'active' : ''">
                    <i class="bi bi-door-open me-2"></i>Salles
                </a>
                <a th:href="@{/seances}" 
                   class="list-group-item list-group-item-action bg-dark text-light"
                   th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/seances')} ? 'active' : ''">
                    <i class="bi bi-calendar-event me-2"></i>Séances
                </a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-light">
                    <i class="bi bi-ticket-perforated me-2"></i>Réservations
                </a>
                <a th:href="@{/admin/tarifs}" 
                   class="list-group-item list-group-item-action bg-dark text-light"
                   th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/tarifs')} ? 'active' : ''">
                    <i class="bi bi-currency-dollar me-2"></i>Tarifs
                </a>
                <a th:href="@{/admin/types-personne}" 
                   class="list-group-item list-group-item-action bg-dark text-light"
                   th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/types-personne')} ? 'active' : ''">
                    <i class="bi bi-people me-2"></i>Types de Personne
                </a>
                <a th:href="@{/admin/societes}" 
                   class="list-group-item list-group-item-action bg-dark text-light"
                   th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/societes')} ? 'active' : ''">
                    <i class="bi bi-building me-2"></i>Sociétés
                </a>
                <a th:href="@{/admin/publicites}" 
                   class="list-group-item list-group-item-action bg-dark text-light"
                   th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/publicites')} ? 'active' : ''">
                    <i class="bi bi-megaphone me-2"></i>Publicités
                </a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-light">
                    <i class="bi bi-graph-up me-2"></i>Statistiques
                </a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-light">
                    <i class="bi bi-gear me-2"></i>Paramètres
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <!-- Top Navbar -->
            <nav class="navbar navbar-dark bg-netflix border-bottom">
                <div class="container-fluid">
                    <button class="btn btn-danger" id="sidebarToggle">
                        <i class="bi bi-list"></i>
                    </button>
                    <div class="d-flex align-items-center">
                        <span class="navbar-text text-light me-3">
                            <i class="bi bi-person-circle me-1"></i>
                            Administrateur
                        </span>
                        <button class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right"></i> Déconnexion
                        </button>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid p-4">
                <!-- Flash Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle me-2"></i>
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Page Content -->
                <div th:replace="${content}"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
