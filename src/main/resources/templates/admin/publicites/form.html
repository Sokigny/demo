<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${publicite.id != null ? 'Modifier la Publicité' : 'Nouvelle Publicité'} + ' - Cinema Admin'">Publicité - Cinema Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i class="bi bi-film"></i>
                    <span>Cinema Admin</span>
                </div>
                <button class="sidebar-toggle">
                    <i class="bi bi-list"></i>
                </button>
            </div>
            <nav>
                <a th:href="@{/admin/dashboard}" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/admin/films}" class="nav-link">
                    <i class="bi bi-camera-reels"></i>
                    <span>Films</span>
                </a>
                <a th:href="@{/admin/salles}" class="nav-link">
                    <i class="bi bi-building"></i>
                    <span>Salles</span>
                </a>
                <a th:href="@{/admin/seances}" class="nav-link">
                    <i class="bi bi-calendar-event"></i>
                    <span>Séances</span>
                </a>
                <a th:href="@{/admin/tarifs}" class="nav-link">
                    <i class="bi bi-currency-dollar"></i>
                    <span>Tarifs</span>
                </a>
                <a th:href="@{/admin/types-personne}" class="nav-link">
                    <i class="bi bi-people"></i>
                    <span>Types de Personne</span>
                </a>
                <a th:href="@{/admin/societes}" class="nav-link">
                    <i class="bi bi-building"></i>
                    <span>Sociétés</span>
                </a>
                <a th:href="@{/admin/publicites}" class="nav-link active">
                    <i class="bi bi-megaphone"></i>
                    <span>Publicités</span>
                </a>                <a th:href="@{/admin/paiements}" class="nav-link">
                    <i class="bi bi-cash-coin"></i>
                    <span>Paiements</span>
                </a>                <a th:href="@{/admin/statistiques}" class="nav-link">
                    <i class="bi bi-graph-up"></i>
                    <span>Statistiques</span>
                </a>
            </nav>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container-fluid">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>
                        <i class="bi bi-megaphone text-netflix-red"></i>
                        <span th:text="${publicite.id != null ? 'Modifier la Publicité' : 'Nouvelle Publicité'}"></span>
                    </h1>
                    <a th:href="@{/admin/publicites}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Retour
                    </a>
                </div>

                <!-- Form -->
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card">
                            <div class="card-body">
                                <form th:action="${publicite.id != null ? '/admin/publicites/update/' + publicite.id : '/admin/publicites'}" 
                                      th:object="${publicite}" 
                                      method="post">
                                    <div class="mb-3">
                                        <label for="seance" class="form-label">Séance</label>
                                        <select class="form-select" id="seance" th:field="*{seance}" required>
                                            <option value="">Sélectionner une séance</option>
                                            <option th:each="seance : ${seances}" 
                                                    th:value="${seance.id}" 
                                                    th:text="${seance.film.titre + ' - ' + seance.heureDebut + ' (' + #temporals.format(seance.dateSeance, 'dd/MM/yyyy') + ')'}">
                                            </option>
                                        </select>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="societe" class="form-label">Société</label>
                                        <select class="form-select" id="societe" th:field="*{societe}" required>
                                            <option value="">Sélectionner une société</option>
                                            <option th:each="societe : ${societes}" 
                                                    th:value="${societe.id}" 
                                                    th:text="${societe.nom}">
                                            </option>
                                        </select>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="mb-3">
                                                <label for="longueur" class="form-label">Longueur (minutes)</label>
                                                <input type="number" step="0.01" class="form-control" id="longueur" th:field="*{longueur}" required>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="mb-3">
                                                <label for="nombre" class="form-label">Nombre</label>
                                                <input type="number" class="form-control" id="nombre" th:field="*{nombre}" required>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="mb-3">
                                                <label for="date" class="form-label">Date</label>
                                                <input type="date" class="form-control" id="date" th:field="*{date}" required>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-netflix">
                                            <i class="bi bi-save me-2"></i>Enregistrer
                                        </button>
                                        <a th:href="@{/admin/publicites}" class="btn btn-outline-secondary">Annuler</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
