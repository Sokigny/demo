<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séances - Cinéma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #141414;
            color: #fff;
            min-height: 100vh;
        }

        /* Navbar Netflix Style */
        .netflix-navbar {
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            padding: 20px 50px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: background 0.3s;
        }

        .netflix-navbar.scrolled {
            background: #141414;
        }

        .navbar-brand-netflix {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: #E50914;
            font-weight: bold;
            letter-spacing: 2px;
            text-decoration: none;
        }

        /* Main Content */
        .main-content {
            padding-top: 100px;
            padding-left: 50px;
            padding-right: 50px;
            padding-bottom: 50px;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: #fff;
        }

        /* Search Section */
        .search-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        .search-section h5 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #fff;
        }

        .search-section .form-control,
        .search-section .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 15px;
            border-radius: 4px;
        }

        .search-section .form-control:focus,
        .search-section .form-select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #E50914;
            box-shadow: 0 0 0 0.2rem rgba(229, 9, 20, 0.25);
            color: #fff;
        }

        .search-section .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-section .form-select option {
            background: #141414;
            color: #fff;
        }

        .btn-netflix {
            background: #E50914;
            color: #fff;
            border: none;
            padding: 10px 30px;
            border-radius: 4px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-netflix:hover {
            background: #f40612;
            transform: scale(1.05);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 30px;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* Date Section */
        .date-section {
            margin-bottom: 40px;
        }

        .date-header {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-header i {
            color: #E50914;
        }

        /* Movie Grid Netflix Style */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .movie-card {
            background: #2f2f2f;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .movie-poster {
            width: 100%;
            height: 400px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #b3b3b3;
        }

        .movie-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .movie-meta-item i {
            color: #E50914;
        }

        .seance-info {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .seance-time {
            font-size: 1.3rem;
            font-weight: 700;
            color: #E50914;
            margin-bottom: 5px;
        }

        .seance-details {
            font-size: 0.85rem;
            color: #b3b3b3;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .badge-netflix {
            background: #E50914;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
        }

        .badge-seats {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            display: inline-block;
        }

        .badge-seats.full {
            background: rgba(229, 9, 20, 0.3);
            color: #E50914;
        }

        .btn-reserve {
            width: 100%;
            background: #E50914;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 10px;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-reserve:hover {
            background: #f40612;
            transform: translateY(-2px);
            color: #fff;
        }

        .btn-reserve:disabled,
        .btn-reserve.disabled {
            background: rgba(255, 255, 255, 0.1);
            color: #666;
            cursor: not-allowed;
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: #b3b3b3;
        }

        .no-results i {
            font-size: 5rem;
            margin-bottom: 20px;
            color: rgba(229, 9, 20, 0.3);
        }

        .no-results h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #fff;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                padding: 80px 20px 30px;
            }

            .netflix-navbar {
                padding: 15px 20px;
            }

            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .movie-poster {
                height: 250px;
            }

            .page-title {
                font-size: 1.5rem;
            }
        }

        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 50px;
        }

        .loading i {
            font-size: 3rem;
            color: #E50914;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navbar Netflix -->
    <nav class="netflix-navbar" id="navbar">
        <a href="/" class="navbar-brand-netflix">CINEMA</a>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <h1 class="page-title">
            <i class="bi bi-film"></i> Séances Disponibles
        </h1>

        <!-- Search Section -->
        <div class="search-section">
            <h5><i class="bi bi-search me-2"></i>Rechercher une séance</h5>
            <form method="get" action="/seances">
                <div class="row g-3">
                    <div class="col-md-2">
                        <select class="form-select" name="nomFilm">
                            <option value="">Tous les films</option>
                            <option th:each="film : ${films}" 
                                    th:value="${film.titre}" 
                                    th:text="${film.titre}"
                                    th:selected="${nomFilm != null && nomFilm == film.titre}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="text" 
                               class="form-control" 
                               name="date" 
                               placeholder="JJ/MM/AAAA"
                               th:value="${date != null ? #temporals.format(date, 'dd/MM/yyyy') : ''}">
                    </div>
                    <div class="col-md-2">
                        <input type="text" 
                               class="form-control" 
                               name="heure"
                               placeholder="HH:MM"
                               th:value="${heure != null ? #temporals.format(heure, 'HH:mm') : ''}">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="salleId">
                            <option value="">Toutes les salles</option>
                            <option th:each="salle : ${salles}" 
                                    th:value="${salle.id}" 
                                    th:text="${salle.nom + ' - ' + (salle.cinema != null ? salle.cinema.nom : '')}"
                                    th:selected="${salleId != null && salleId == salle.id}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="cinemaId">
                            <option value="">Tous les cinémas</option>
                            <option th:each="cinema : ${cinemas}" 
                                    th:value="${cinema.id}" 
                                    th:text="${cinema.nom}"
                                    th:selected="${cinemaId != null && cinemaId == cinema.id}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-netflix w-100">
                            <i class="bi bi-search me-1"></i> Rechercher
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Results -->
        <div th:if="${seances != null && !seances.empty}">
            <div class="movie-grid">
                <div th:each="seance : ${seances}" class="movie-card">
                    <div class="movie-poster">
                        <div th:if="${seance.film.imageUrl != null && !seance.film.imageUrl.empty}" style="width: 100%; height: 100%;">
                            <img th:src="${seance.film.imageUrl}" th:alt="${seance.film.titre}">
                        </div>
                        <i th:if="${seance.film.imageUrl == null || seance.film.imageUrl.empty}" class="bi bi-film"></i>
                    </div>
                    
                    <div class="movie-info">
                        <div class="movie-title" th:text="${seance.film.titre}">Titre du Film</div>
                        
                        <div class="movie-meta">
                            <span class="movie-meta-item">
                                <i class="bi bi-calendar3"></i>
                                <span th:text="${#temporals.format(seance.dateSeance, 'dd/MM/yyyy')}">22/01/2026</span>
                            </span>
                            <span class="movie-meta-item">
                                <i class="bi bi-clock"></i>
                                <span th:text="${seance.film.duree + ' min'}">120 min</span>
                            </span>
                        </div>

                        <div th:if="${seance.film.genre}" class="movie-meta">
                            <span class="movie-meta-item">
                                <i class="bi bi-tag"></i>
                                <span th:text="${seance.film.genre}">Action</span>
                            </span>
                        </div>

                        <div class="seance-info">
                            <div class="seance-time" th:text="${#temporals.format(seance.heureDebut, 'HH:mm')}">20:00</div>
                            <div class="seance-details">
                                <div>
                                    <i class="bi bi-building me-1"></i>
                                    <span th:text="${seance.salle.cinema != null ? seance.salle.cinema.nom : 'N/A'}">Cinéma</span>
                                </div>
                                <div>
                                    <i class="bi bi-door-open me-1"></i>
                                    <span th:text="'Salle ' + ${seance.salle.nom}">Salle 1</span>
                                </div>
                                <div th:with="placesDisponibles=${placesDisponiblesMap[seance.id] != null ? placesDisponiblesMap[seance.id] : 0},
                                              capacite=${capaciteMap[seance.id] != null ? capaciteMap[seance.id] : 0},
                                              seatsMap=${availableSeatsMap[seance.id]}">
                                    <div th:if="${seatsMap != null && !seatsMap.isEmpty()}" style="font-size: 0.75rem; margin-top: 5px; color: #b3b3b3;">
                                        <span th:each="entry, iterStat : ${seatsMap}" style="display: inline-block; margin-right: 8px;">
                                            <i class="bi bi-check-circle me-1" th:style="${entry.value > 0 ? 'color: #4CAF50;' : 'color: #E50914;'}"></i>
                                            <span th:text="${entry.key + ': ' + entry.value}">VIP: 10</span>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div th:with="placesDisponibles=${placesDisponiblesMap[seance.id] != null ? placesDisponiblesMap[seance.id] : 0}">
                            <a th:if="${placesDisponibles > 0}" 
                               th:href="@{/reservation/seats/{id}(id=${seance.id})}" 
                               class="btn-reserve">
                                <i class="bi bi-ticket-perforated me-1"></i>
                                <span>Réserver</span>
                            </a>
                            <button th:if="${placesDisponibles == 0}" 
                                    class="btn-reserve disabled" 
                                    disabled>
                                <i class="bi bi-ticket-perforated me-1"></i>
                                <span>Complet</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- No Results -->
        <div th:if="${seances == null || seances.empty}" class="no-results">
            <i class="bi bi-film"></i>
            <h3>Aucune séance trouvée</h3>
            <p>Essayez de modifier vos critères de recherche</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Navbar scroll effect
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
